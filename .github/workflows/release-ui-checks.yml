name: Release UI checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI_EXTERNAL_EMULATOR: 'true'
      CI_STAGED_PIPELINE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compile instrumentation tests
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Release compiler memory before emulator boot
        run: ./gradlew --stop
      - name: Check calendar, import lifecycle, voice presentation, recurring payments and Android financial parser
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -camera-back none
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb shell input keyevent 224
            adb shell input keyevent 82
            adb shell wm dismiss-keyguard
            adb shell am force-stop com.android.launcher3
            mkdir -p build/test-artifacts
            nohup adb logcat -b all -v threadtime -T 1 </dev/null > build/test-artifacts/device-stream.log 2>&1 &
            ./gradlew :app:connectedDebugAndroidTest -Dorg.gradle.jvmargs="-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC -Dfile.encoding=UTF-8" -Pandroid.testInstrumentationRunnerArguments.class=com.example.ui.components.SingleDatePickerContentUiTest,com.example.davidapp.live.DavidLiveFinancialParserAndroidTest,com.example.ui.components.dialogs.RecurringPaymentsExpandableCardUiTest,com.example.ui.components.BudgetDocumentImportUiTest,com.example.davidapp.live.DavidLivePresentationUiTest
      - name: Collect host memory diagnostics
        if: always()
        run: |
          mkdir -p build/test-artifacts
          free -m > build/test-artifacts/host-memory.txt
          cp -r /tmp/android-runner/emu-crash-* build/test-artifacts/ 2>/dev/null || true
          sudo dmesg --ctime | rg -i 'out of memory|oom-kill|killed process|qemu' | tail -30 > build/test-artifacts/host-oom.txt || true
      - name: Collect screenshots
        if: always()
        run: timeout --kill-after=2s 30s adb pull /sdcard/Download/release-screenshots screenshots || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-ui-results
          path: |
            app/build/reports/androidTests/connected
            app/build/outputs/androidTest-results/connected
            screenshots
            build/test-artifacts
