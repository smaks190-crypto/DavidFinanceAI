name: Visual user journey audit

on:
  pull_request:
    paths:
      - 'app/**'
      - 'core/**'
      - 'ci/build_user_journey_report.py'
      - '.github/workflows/user-journey-audit.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'core/**'
      - 'ci/build_user_journey_report.py'
      - '.github/workflows/user-journey-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: user-journey-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  user-journey:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI_EXTERNAL_EMULATOR: 'true'
      CI_STAGED_PIPELINE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Compile application and instrumentation test
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon

      - name: Free Gradle daemon memory before launching emulator
        run: ./gradlew --stop

      - name: Walk through app like a new user and capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell input keyevent 224
            adb shell input keyevent 82
            adb shell wm dismiss-keyguard
            # Reset only the isolated CI emulator; never a physical device.
            adb shell pm clear ru.personalbudget.app.aadece.preview || true
            mkdir -p build/user-journey-raw
            set +e
            ./gradlew :app:connectedDebugAndroidTest --no-daemon \
              -Dorg.gradle.jvmargs="-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC" \
              -Pandroid.testInstrumentationRunnerArguments.class=com.example.UserJourneyVisualAuditTest
            status=$?
            # Pull before the emulator-runner stops the Android VM.
            adb pull /sdcard/Android/data/ru.personalbudget.app.aadece.preview/files/user-journey-audit/ \
              build/user-journey-raw/ || true
            echo "instrumentation_exit_code=$status" > build/user-journey-raw/test-status.txt
            exit "$status"

      - name: Build visual gallery and findings for pull requests
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: python3 ci/build_user_journey_report.py --screenshots build/user-journey-raw --output build/user-journey-audit

      - name: Build visual gallery and optional AI recommendations
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          VISUAL_AUDIT_API_KEY: ${{ secrets.VISUAL_AUDIT_API_KEY }}
          VISUAL_AUDIT_MODEL: ${{ vars.VISUAL_AUDIT_MODEL || 'gpt-4.1-mini' }}
          VISUAL_AUDIT_API_URL: ${{ vars.VISUAL_AUDIT_API_URL || 'https://api.openai.com/v1/chat/completions' }}
        run: python3 ci/build_user_journey_report.py --screenshots build/user-journey-raw --output build/user-journey-audit

      - name: Publish screenshots, semantics, and UX audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: user-journey-visual-audit
          path: |
            build/user-journey-raw
            build/user-journey-audit
            app/build/reports/androidTests/connected
            app/build/outputs/androidTest-results/connected
          retention-days: 14
